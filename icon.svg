<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background with squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Inner circular ring -->
  <circle cx="256" cy="235" r="165" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="8 6" opacity="0.35" />
  <!-- Stylized Kerala Coastal Fish Motif -->
  <g transform="translate(256, 225) scale(1.05)">
    <!-- Main fish body -->
    <path d="M-130,-15 C-80,-75 60,-70 120,0 C60,70 -80,75 -130,15 C-155,45 -180,65 -190,55 C-170,10 -170,-10 -190,-55 C-180,-65 -155,-45 -130,-15 Z" fill="url(#fishGrad)" />
    <!-- Dorsal Fin -->
    <path d="M-40,-65 C-10,-95 50,-85 70,-45 C40,-50 -10,-55 -40,-65 Z" fill="#fef08a" opacity="0.9" />
    <!-- Ventral Fin -->
    <path d="M-20,65 C10,90 60,75 70,45 C40,50 10,55 -20,65 Z" fill="#d97706" opacity="0.8" />
    <!-- Fish Eye -->
    <circle cx="75" cy="-8" r="14" fill="#ffffff" />
    <circle cx="77" cy="-8" r="8" fill="#1c1917" />
    <circle cx="80" cy="-11" r="3" fill="#ffffff" />
    <!-- Fish Gill Arc -->
    <path d="M25,-35 C40,-15 40,15 25,35" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
    <!-- Kerala Spices / Wave scales -->
    <path d="M-30,-20 C-15,-10 -15,10 -30,20" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <path d="M-75,-15 C-60,-8 -60,8 -75,15" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  </g>
  <!-- Text Branding -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3">BUBSHI FOOD HUB</text>
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#fde68a" letter-spacing="1">STATION KADAVU • KERALA</text>
</svg>
