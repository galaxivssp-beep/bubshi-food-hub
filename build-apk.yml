name: Build BUBSHI FOOD HUB Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Set execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK (For direct phone testing)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle (.aab for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace || true

      - name: Upload Debug APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BUBSHI-FOOD-HUB-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BUBSHI-FOOD-HUB-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 14
